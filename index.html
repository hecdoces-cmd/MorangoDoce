let seed=Array.from({length:60},(_,i)=>({id:i+1,name:cats[i%8]+' '+colors[i%6].toLowerCase(),cat:cats[i%8],dep:deps[i%4],size:sizes[i%9],color:colors[i%6],price:[2,5,8,10,12,15,20,25,30,50][i%10],cost:0,status:'Disponível',icon:icons[i%8]}));let db;try{db=JSON.parse(localStorage.getItem('morango-demo-v1'))}catch{} db=db||{products:seed,orders:[],expenses:[],fav:[],bag:[],user:'',pix:'',cash:false};db.settings={pickup:true,delivery:true,limit:0,orders:0,minimum:0,hours:'Combinar com a proprietária',expiry:24,...db.settings};let page='Início',admin=false,filters={price:'',dep:'',cat:'',size:'',color:'',q:'',sort:'new'};function save(){localStorage.setItem('morango-demo-v1',JSON.stringify(db))}function go(p){page=p;render();window.scrollTo(0,0)}function btn(t,code,cls=''){return `<button class="${cls}" onclick="${code}">${t}</button>`}function options(a,v){return '<option value="">Todos</option>'+a.map(x=>`<option ${x===v?'selected':''}>${esc(x)}</option>`).join('')}function filter(k,v){filters[k]=v;page='Catálogo';render()}function toggle(k,id){db[k]=db[k].includes(id)?db[k].filter(x=>x!==id):[...db[k],id];save();render()}function cards(ps){return `<div class="grid">${ps.map(p=>`<article class="tile"><div class="photo">${p.icon||'👕'}</div><div class="muted">${esc(p.dep)} · ${esc(p.size)} · ${esc(p.color)}</div><h3>${esc(p.name)}</h3><p class="muted">${esc(p.description||'Peça demonstrativa')}</p><div class="price">${money(p.price)}</div>${btn(db.fav.includes(p.id)?'♥':'♡',`toggle('fav',${p.id})`)} ${btn(db.bag.includes(p.id)?'Remover':'Cestinha +',`toggle('bag',${p.id})`,'primary')}</article>`).join('')}</div>`}function render(){for(let o of db.orders){if(o.status==='Aprovada'&&db.settings.expiry&&o.approvedAt&&Date.now()-o.approvedAt>db.settings.expiry*3600000){o.status='Cancelada';for(let id of o.ids){let p=db.products.find(x=>x.id===id);if(p&&p.status==='Reservada')p.status='Disponível'}save()}} $('nav').innerHTML=(admin?['Painel','Produtos','Reservas','Financeiro','Agenda','Clientes','Configurações','Sair gestão']:['Início','Catálogo','Meus amores','Minha cestinha ('+db.bag.length+')','Minha conta','Gestão demo']).map(p=>btn(p,`go('${p.startsWith('Minha cestinha')?'Cestinha':p==='Meus amores'?'Favoritos':p==='Minha conta'?'Perfil':p}')`,page===p?'primary':'')).join('');let h='',available=db.products.filter(p=>p.status==='Disponível');if(page==='Gestão demo'){admin=true;return go('Painel')}if(page==='Sair gestão'){admin=false;return go('Início')}if(page==='Início'){h=`<section class="hero"><span>🍓</span><div class="pill">MODA CIRCULAR • PREÇOS DOCINHOS</div><h1>Achadinhos que dão vontade de levar!</h1><p>Peças únicas, novas histórias e economia de verdade.</p>${btn('Explorar a coleção',"go('Catálogo')",'primary')}</section><div class="panel">🍓 Pix manual · Retirada gratuita mediante combinação · Entrega por aplicativo com frete por conta do cliente, informado antes do pagamento.</div><h2>Garimpe pelo preço</h2><div class="grid">${[5,10,15,20,30,50].map(n=>`<div class="tile"><div class="muted">Tudo até</div><div class="price">${money(n)}</div>${btn('Explorar 🍓',`filter('price','${n}')`)}</div>`).join('')}</div><h2>Moranguinhos fresquinhos</h2>${cards(available.slice(-8).reverse())}`}if(page==='Catálogo'){let ps=available.filter(p=>(!filters.price||(filters.price.includes(':')?p.price>+filters.price.split(':')[0]&&p.price<=+filters.price.split(':')[1]:p.price<=+filters.price))&&['dep','cat','size','color'].every(k=>!filters[k]||p[k]===filters[k])&&p.name.toLowerCase().includes(filters.q.toLowerCase()));if(filters.sort==='low')ps.sort((a,b)=>a.price-b.price);if(filters.sort==='high')ps.sort((a,b)=>b.price-a.price);h=`<h2>Garimpo doce</h2><div class="filters"><input placeholder="Buscar peça" value="${esc(filters.q)}" onchange="filter('q',this.value)"><select onchange="filter('price',this.value)"><option value="">Qualquer preço</option>${[[0,5],[5,10],[10,15],[15,20],[20,30],[30,50],[50,999999]].map(([a,b])=>`<option value="${a}:${b}" ${filters.price===a+':'+b?'selected':''}>${a===50?'Acima de R$ 50':money(a===0?0:a+.01)+' a '+money(b)}</option>`).join('')}${[5,10,15,20,30,50].map(n=>`<option value="${n}" ${filters.price==n?'selected':''}>Até R$ ${n}</option>`).join('')}</select>${[['dep',deps],['cat',cats],['size',sizes],['color',colors]].map(([k,a])=>`<select aria-label="${k}" onchange="filter('${k}',this.value)">${options(a,filters[k])}</select>`).join('')}<select onchange="filter('sort',this.value)">${[['new','Padrão'],['low','Menor preço'],['high','Maior preço']].map(([v,t])=>`<option value="${v}" ${filters.sort===v?'selected':''}>${t}</option>`).join('')}</select>${btn('Limpar',"filters={price:'',dep:'',cat:'',size:'',color:'',q:'',sort:'new'};render()")}</div><p>${ps.length} peças encontradas</p>${cards(ps)}`}if(page==='Favoritos')h='<h2>Meus amores</h2>'+cards(available.filter(p=>db.fav.includes(p.id)));if(page==='Cestinha'){let ps=available.filter(p=>db.bag.includes(p.id));h='<h2>Minha cestinha</h2>'+ps.map(p=>`<div class="line">${esc(p.name)} • ${money(p.price)} ${btn('Remover',`toggle('bag',${p.id})`)}</div>`).join('')+`<h2>Total: ${money(ps.reduce((s,p)=>s+p.price,0))}</h2>${ps.length?btn('Finalizar reserva','checkout()','primary'):'Sua cestinha está vazia.'}`}if(page==='Perfil')h=`<h2>Meu perfil</h2><div class="panel">${db.user?'Olá, '+esc(db.user):'Entre com um apelido fictício para testar.'}<p><input id="nick" placeholder="Apelido fictício"> ${btn('Entrar / cadastrar',"db.user=$('nick').value.trim();save();render()")}</p><p class="muted">Login simulado, sem senha ou dados pessoais.</p>${btn('Sair',"db.user='';save();render()")}</div><h2>Minhas reservas</h2>${db.orders.filter(o=>db.user&&o.user===db.user).map(o=>`<div class="panel">#${o.id} • ${esc(o.status)} • ${money(o.total)} ${customerOrder(o)}</div>`).join('')}`;let sold=db.orders.filter(o=>['Vendida','Em separação','Pronto','Concluída'].includes(o.status)),rev=sold.reduce((s,o)=>s+o.total,0),exp=db.expenses.reduce((s,e)=>s+e.value,0);if(page==='Painel'||page==='Financeiro'){h=`<h2>${page==='Painel'?'Olá, Morango Doce!':'Financeiro'}</h2><div class="grid">${[['Receitas das peças',money(rev)],['Frete recebido',money(sold.reduce((a,o)=>a+(o.freight||0),0))],['Despesas',money(exp)],['Saldo de caixa',money(rev-exp)],['Peças disponíveis',available.length],['Reservas pendentes',db.orders.filter(o=>o.status==='Pendente').length],['Pix recebido',money(sold.filter(o=>o.method==='Pix').reduce((s,o)=>s+o.total,0))]].map(([a,b])=>`<div class="tile"><div class="muted">${a}</div><div class="price">${b}</div></div>`).join('')}</div><h2>Despesas</h2><div class="panel"><input id="expense" placeholder="Descrição"><input id="amount" type="number" min="0" placeholder="Valor">${btn('Registrar despesa','expense()','primary')}</div>${db.expenses.map(e=>`<div class="line">${esc(e.name)} ${money(e.value)}</div>`).join('')}<h2>Vendas confirmadas</h2>${sold.map(o=>`<div class="line">#${o.id} · ${o.method} · ${money(o.total)}</div>`).join('')}`}if(page==='Produtos')h=`<h2>Estoque</h2>${btn('Cadastrar peça','edit(0)','primary')}${db.products.map(p=>`<div class="line"><span>${p.icon} ${esc(p.name)} · ${money(p.price)} · ${p.status}</span>${btn('Editar',`edit(${p.id})`)}</div>`).join('')}`;if(page==='Reservas')h='<h2>Reservas e vendas</h2>'+db.orders.map(o=>`<div class="panel"><b>#${o.id} · ${esc(o.user)}</b><p>${o.ids.map(id=>esc(db.products.find(p=>p.id===id)?.name)).join(', ')}</p><p>${money(o.total)} · ${o.status}</p>${manageOrder(o)}${o.status==='Aprovada'&&o.accepted?btn('Confirmar Pix recebido',`order(${o.id},'Vendida','Pix')`,'primary'):''}${o.status==='Aprovada'&&o.accepted&&db.cash&&o.delivery==='pickup'?btn('Confirmar dinheiro',`order(${o.id},'Vendida','Dinheiro')`):''}${['Pendente','Aprovada'].includes(o.status)?btn('Cancelar',`order(${o.id},'Cancelada')`):''}</div>`).join('');if(page==='Configurações')h=`<h2>Configurações</h2><div class="panel"><p>Pix manual — nesta demonstração não insira chaves reais.</p><input id="pix" value="${esc(db.pix)}" placeholder="Chave fictícia"><label><input type="checkbox" id="cash" ${db.cash?'checked':''}> Aceitar dinheiro presencial</label>${settingsForm()}${btn('Salvar','saveSettings()','primary')}</div>`;if(page==='Agenda')h='<h2>Agenda de retiradas</h2>'+db.orders.filter(o=>o.delivery==='pickup'&&!['Cancelada','Concluída'].includes(o.status)).map(o=>`<div class="panel">${esc(o.user)} · ${esc(o.slot||'A combinar')} · ${esc(o.status)}</div>`).join('');if(page==='Clientes')h='<h2>Clientes demonstrativos</h2>'+[...new Set(db.orders.map(o=>o.user))].map(u=>`<div class="panel">${esc(u)} · ${db.orders.filter(o=>o.user===u).length} pedidos</div>`).join('');$('main').innerHTML=h||'<p>Nenhum registro.</p>'}function reserve(delivery,slot){if(!db.user){go('Perfil');return}let ps=db.products.filter(p=>db.bag.includes(p.id)&&p.status==='Disponível');if(!ps.length)return;db.orders.push({id:Date.now(),user:db.user,ids:ps.map(p=>p.id),total:ps.reduce((s,p)=>s+p.price,0),status:'Pendente',delivery,slot,freight:0,accepted:false,created:Date.now()});ps.forEach(p=>p.status='Reservada');db.bag=[];save();go('Perfil')}function order(id,status,method){let o=db.orders.find(o=>o.id===id);if(!o||!['Pendente','Aprovada'].includes(o.status))return;o.status=status;o.method=method||'';o.ids.forEach(id=>{let p=db.products.find(p=>p.id===id);p.status=status==='Vendida'?'Vendida':status==='Cancelada'?'Disponível':'Reservada'});save();render()}function expense(){let name=$('expense').value.trim(),value=+$('amount').value;if(name&&value>0){db.expenses.push({name,value});save();render()}}function edit(id){let p=db.products.find(p=>p.id===id)||{name:'',price:5,cost:0,dep:deps[0],cat:cats[0],size:sizes[0],color:colors[0]};$('modal').innerHTML=`<form id="editform"><h2>${id?'Editar':'Nova'} peça</h2><label>Nome<input name="name" required value="${esc(p.name)}"></label>${[['dep',deps],['cat',cats],['size',sizes],['color',colors]].map(([k,a])=>`<label>${k}<select name="${k}">${a.map(v=>`<option ${v===p[k]?'selected':''}>${v}</option>`).join('')}</select></label>`).join('')}<label>Preço<input name="price" type="number" min="0.01" step="0.01" required value="${p.price}"></label><label>Descrição<input name="description" value="${esc(p.description||'')}"></label><label>Custo<input name="cost" type="number" min="0" step="0.01" value="${p.cost}"></label><button class="primary">Salvar</button> <button type="button" onclick="$('modal').close()">Cancelar</button></form>`;$('modal').showModal();$('editform').onsubmit=e=>{e.preventDefault();let v=Object.fromEntries(new FormData(e.target));v.price=+v.price;v.cost=+v.cost;v.icon=icons[cats.indexOf(v.cat)];if(id)Object.assign(p,v);else db.products.push({...v,id:Date.now(),status:'Disponível'});save();$('modal').close();render()}}
function settingsForm(){let t=db.settings;return `<label><input type="checkbox" id="pickup" ${t.pickup?'checked':''}> Retirada gratuita</label><label><input type="checkbox" id="delivery" ${t.delivery?'checked':''}> Entrega por aplicativo</label><label>Disponibilidade de retirada<input id="hours" value="${esc(t.hours)}"></label>${[['limit','Máximo de peças por pedido'],['orders','Máximo de reservas ativas por cliente'],['minimum','Valor mínimo (R$)'],['expiry','Prazo de pagamento (horas)']].map(([k,l])=>`<label>${l} (0 = sem limite)<input type="number" min="0" id="${k}" value="${t[k]}"></label>`).join('')}`}
function saveSettings(){for(let k of ['pickup','delivery'])db.settings[k]=$(k).checked;for(let k of ['limit','orders','minimum','expiry'])db.settings[k]=Math.max(0,+$(k).value||0);db.settings.hours=$('hours').value;db.pix=$('pix').value;db.cash=$('cash').checked;save();render()}
function checkout(){if(!db.user){alert('Entre com um apelido fictício e volte à cestinha.');return go('Perfil')}let ps=db.products.filter(p=>db.bag.includes(p.id)&&p.status==='Disponível'),t=db.settings,total=ps.reduce((a,p)=>a+p.price,0);if(!ps.length)return;if(t.limit&&ps.length>t.limit)return alert('Limite de '+t.limit+' peças por pedido.');if(t.minimum&&total<t.minimum)return alert('Pedido mínimo: '+money(t.minimum));if(t.orders&&db.orders.filter(o=>o.user===db.user&&['Pendente','Aprovada'].includes(o.status)).length>=t.orders)return alert('Limite de reservas ativas atingido.');if(!t.pickup&&!t.delivery)return alert('Recebimento temporariamente indisponível.');$('modal').innerHTML=`<form id="checkoutForm"><h2>Como receber?</h2><p>Produtos: ${money(total)}</p><label>Modalidade<select name="delivery">${t.pickup?'<option value="pickup">Retirada gratuita</option>':''}${t.delivery?'<option value="delivery">Entrega por aplicativo — frete a calcular</option>':''}</select></label><p>${esc(t.hours)}</p><label>Preferência de horário ou bairro fictício<input name="slot" placeholder="Ex.: sábado à tarde"></label><p>Frete por conta do cliente, informado antes do Pix. Não use dados reais nesta demonstração.</p><button class="primary">Solicitar reserva</button><button type="button" onclick="$('modal').close()">Voltar</button></form>`;$('modal').showModal();$('checkoutForm').onsubmit=e=>{e.preventDefault();let v=Object.fromEntries(new FormData(e.target));$('modal').close();reserve(v.delivery,v.slot)}}
function manageOrder(o){let h=`<p>${o.delivery==='delivery'?'Entrega por aplicativo':'Retirada gratuita'} · ${esc(o.slot||'A combinar')} · Frete: ${money(o.freight||0)}</p>`;if(o.status==='Pendente')h+=`<label>Frete (R$)<input id="fee${o.id}" type="number" min="0" step="0.01" value="${o.freight||0}" ${o.delivery==='delivery'?'':'disabled'}></label><label>Horário combinado<input id="slot${o.id}" value="${esc(o.slot||'')}"></label>${btn('Aprovar e enviar orçamento',`quote(${o.id})`,'primary')}`;if(o.status==='Aprovada'&&!o.accepted)h+='<p>Aguardando aceite do cliente.</p>';let next={'Vendida':'Em separação','Em separação':'Pronto','Pronto':'Concluída'}[o.status];if(next)h+=btn(next,`advance(${o.id},'${next}')`);return h}
function quote(id){let o=db.orders.find(x=>x.id===id),f=Number($('fee'+id).value);if(!Number.isFinite(f)||f<0)return alert('Frete inválido');o.freight=o.delivery==='delivery'?f:0;o.slot=$('slot'+id).value;o.accepted=false;o.approvedAt=Date.now();order(id,'Aprovada')}
function customerOrder(o){let h=`<p>${o.delivery==='delivery'?'Entrega':'Retirada'} · ${esc(o.slot||'A combinar')} · Frete ${money(o.freight||0)} · Total ${money(o.total+(o.freight||0))}</p>`;if(o.status==='Aprovada')h+=o.accepted?`<p>Pix demonstrativo: ${esc(db.pix||'CHAVE-FICTICIA')} · Aguarde confirmação manual.</p>`:btn('Aceitar orçamento',`acceptQuote(${o.id})`,'primary');return h}
function acceptQuote(id){let o=db.orders.find(x=>x.id===id&&x.user===db.user&&x.status==='Aprovada');if(o){o.accepted=true;save();render()}}
function advance(id,status){let o=db.orders.find(x=>x.id===id);if(o){o.status=status;save();render()}}
render();</script></html>
